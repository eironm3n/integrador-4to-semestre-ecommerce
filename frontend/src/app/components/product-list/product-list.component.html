<div class="product-page home-main-container">
  <div class="sidebar">
    <app-filters-sidebar
      [categories]="categories"
      [initialFilters]="initialFilters"
      (filtersChange)="onFiltersChange($event)"
    ></app-filters-sidebar>
  </div>

  <div class="content">
    @if (hasFilters) {
      <div class="categories-container">
        @for (category of categories; track category) {
          <div>
            <ng-container>
              <nb-card style="margin: 15px;">
                <nb-card-header>
                  {{ category.name }}
                </nb-card-header>
                <nb-card-body>
                  <div class="categoty-products-container">
                    @for (product of category.products; track product) {
                      <app-product-item
                        class="product-item"
                        [product]="product"
                        [category]="category.id">
                      </app-product-item>
                    }
                  </div>
                </nb-card-body>
              </nb-card>
            </ng-container>
          </div>
        }
      </div>
    }

    @if (!hasFilters) {
      <div class="products-container">
        @if (isLoading) {
          <nb-card style="margin: 15px;">
            <nb-card-body>
              <nb-spinner size="large">Cargando productos…</nb-spinner>
            </nb-card-body>
          </nb-card>
        }
        @for (product of products; track product) {
          <app-product-item class="product-item" [product]="product">
          </app-product-item>
        }
      </div>
    }
  </div>
</div>
