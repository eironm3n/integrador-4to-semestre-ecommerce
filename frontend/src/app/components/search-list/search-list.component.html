<nb-card class="search-card">
  <nb-card-header>
    <div class="header-content">
      <input
        nbInput
        fullWidth
        placeholder="Buscar producto..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="searchProducts()"
        />
        <button nbButton status="primary" (click)="searchProducts()">Buscar</button>
        <button nbButton status="danger" (click)="close()">
          <nb-icon icon="close-outline"></nb-icon>
        </button>
      </div>
    </nb-card-header>

    <nb-card-body>
      @if (!products.length) {
        <div class="empty-state">
          <nb-icon icon="search-outline"></nb-icon>
          @if (!notFound) {
            <p>Buscá un producto para ver resultados</p>
          }
          @if (notFound) {
            <p>No se encontro ningun producto con ese nombre...</p>
          }
        </div>
      }

      @if (products.length) {
        <div class="products-list">
          @for (p of products; track p) {
            <app-product-item [product]="p" [category]="p.categories[0].id"></app-product-item>
          }
        </div>
      }
    </nb-card-body>
  </nb-card>
