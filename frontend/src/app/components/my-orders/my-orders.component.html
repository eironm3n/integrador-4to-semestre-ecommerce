<div class="center-container">
  <nb-accordion multi>
    @for (order of orders; track order; let i = $index) {
      <nb-accordion-item [collapsed]="i !== 0">
        <nb-accordion-item-header [ngClass]="order.status">
          <div class="header-title">
            Orden #{{order.id}}
            <div class="header-images-container">
              @for (product of order.products; track product; let k = $index) {
                <img [src]="product.image_url" alt="{{ product.name }}" class="header-image"/>
              }
              @if (order.products.length > 5) {
                <div>+{{order.products.length - 5}}</div>
              }
            </div>
          </div>
          <div class="header-status"> {{ order.status.toUpperCase() }} </div>
        </nb-accordion-item-header>
        <nb-accordion-item-body>
          <app-cart [order]="order" [parentClass]="'my-orders-cart'"></app-cart>
        </nb-accordion-item-body>
      </nb-accordion-item>
    }
  </nb-accordion>
</div>
